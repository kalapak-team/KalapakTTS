services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalapaktts_db}
      POSTGRES_USER: ${POSTGRES_USER:-kalapaktts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.11
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env.docker}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1/misc/ping', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  model-download:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "download_voxcpm_model.py"]
    environment:
      HF_HOME: /models
    volumes:
      - model_cache:/models
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kalapaktts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kalapaktts_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.docker}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kalapaktts.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.docker}
      HF_HOME: /models
      AUDIO_FILES_DIR: /data/audio_files
      DEVICE: ${DEVICE:-auto}
      WARM_MODEL_ON_STARTUP: ${WARM_MODEL_ON_STARTUP:-true}
      TTS_MAX_CONCURRENT_JOBS: ${TTS_MAX_CONCURRENT_JOBS:-1}
      TTS_SENTENCE_PAUSE_MS: ${TTS_SENTENCE_PAUSE_MS:-0}
      TTS_PARAGRAPH_PAUSE_MS: ${TTS_PARAGRAPH_PAUSE_MS:-0}
      TTS_CROSSFADE_MS: ${TTS_CROSSFADE_MS:-40}
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/models
      - audio_files:/data/audio_files
      - ./VoiceClone:/app/VoiceClone:ro
    depends_on:
      postgres:
        condition: service_healthy
      model-download:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    restart: unless-stopped

  api-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: backend/Dockerfile.cuda
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kalapaktts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kalapaktts_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.docker}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kalapaktts.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.docker}
      HF_HOME: /models
      AUDIO_FILES_DIR: /data/audio_files
      DEVICE: cuda
      WARM_MODEL_ON_STARTUP: ${WARM_MODEL_ON_STARTUP:-true}
      TTS_MAX_CONCURRENT_JOBS: ${TTS_MAX_CONCURRENT_JOBS:-1}
      TTS_SENTENCE_PAUSE_MS: ${TTS_SENTENCE_PAUSE_MS:-0}
      TTS_PARAGRAPH_PAUSE_MS: ${TTS_PARAGRAPH_PAUSE_MS:-0}
      TTS_CROSSFADE_MS: ${TTS_CROSSFADE_MS:-40}
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/models
      - audio_files:/data/audio_files
      - ./VoiceClone:/app/VoiceClone:ro
    depends_on:
      postgres:
        condition: service_healthy
      model-download:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  model_cache:
  audio_files:
